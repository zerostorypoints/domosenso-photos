album_add:
  name: Add album
  description: >-
    Adds a shared Synology Photos album without a password and runs its first sync. A link with a
    password returns the album with status auth_failed: add such links in the integration options
    (Configure -> Add album).
  fields:
    url:
      name: Share link
      description: Synology Photos share link.
      required: true
      example: "https://photos.example.com/mo/sharing/AbCdEf123"
      selector:
        text:
          type: url
    path:
      name: Folder
      description: Folder inside the photo folder; empty uses year/month/album name.
      example: "2026/11/Holiday"
      selector:
        text:
album_remove:
  name: Remove album
  description: >-
    Removes an album: deletes the photos it synced and its sync marker, and the folder only if
    nothing else is left in it.
  fields:
    album_id:
      name: Album ID
      description: ID from the albums attribute of sensor.domosenso_photos_albums.
      required: true
      example: "0123456789abcdef"
      selector:
        text:
album_sync:
  name: Sync albums
  description: Syncs one album or all albums now.
  fields:
    album_id:
      name: Album ID
      description: ID of the album to sync; empty syncs all.
      example: "0123456789abcdef"
      selector:
        text:
    confirm_deletions:
      name: Confirm deletions
      description: Delete photos that a held sync kept because more than half disappeared.
      default: false
      selector:
        boolean:
lightroom_sync:
  name: Sync Lightroom
  description: Syncs one Lightroom library or all of them now and returns their state.
  fields:
    entry_id:
      name: Library
      description: Config entry ID of the Lightroom library; empty syncs all.
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: domosenso_photos
    confirm:
      name: Confirm held changes
      description: Apply the removals and moves that a held sync kept back.
      default: false
      selector:
        boolean:
lightroom_preview:
  name: Preview Lightroom
  description: >-
    Counts, from the cached library, what a sync with the current filter would keep, add, remove and
    move. Makes no request to Adobe.
  fields:
    entry_id:
      name: Library
      description: Config entry ID of the Lightroom library; empty previews all.
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: domosenso_photos
